---
name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: "${{ github.workflow }}-$${{ github.pull_request.number || github.run_id }}"
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  golangci-lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26"
          check-latest: true
      - uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.9.0
